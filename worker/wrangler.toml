name = "urlaubskalender-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Households untouched for this many days are deleted by the daily cron.
[vars]
ALLOWED_ORIGINS = "https://markusf-dev.github.io,http://localhost:8766"
RETENTION_DAYS = "730"

[[d1_databases]]
binding = "DB"
database_name = "urlaubskalender"
# Created with `npx wrangler d1 create urlaubskalender --location weur`.
database_id = "ac5349df-a16c-423c-a1db-f24ce6df6389"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = false
